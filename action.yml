name: Monsieur Cuisine cookbook
description: Validate cookbook Markdown, prepare recipe drafts in pull requests, publish after merge, and fetch recipes.
inputs:
  operation:
    description: "Action to run: validate Markdown, compare recipe JSON, prepare pull-request drafts, publish recipes, or get one recipe."
    required: false
    default: validate
  recipes:
    description: Glob for recipe Markdown files.
    required: false
    default: recipes/**/*.md
  recipe_files:
    description: JSON array of exact, repo-relative Markdown file paths to convert. Overrides recipes.
    required: false
  output:
    description: Directory where JSON payloads are written.
    required: false
    default: build/recipes
  markdown_output:
    description: Directory where a fetched recipe Markdown file is written.
    required: false
    default: recipes
  recipe:
    description: Optional recipe ID or full Monsieur Cuisine recipe URL to fetch instead of converting Markdown files.
    required: false
  session_token:
    description: CLI API access token from session.json, required for get, draft, and publish operations.
    required: false
  secrets_write_token:
    description: Token with Actions secrets write permission, required for get, draft, and publish operations so refreshed MC_API_ACCESS_TOKEN values are persisted.
    required: false
  capture_validation:
    description: Return Markdown validation errors as outputs instead of failing the action.
    required: false
    default: "false"
  compare_source:
    description: Path to the first recipe JSON file for the compare operation.
    required: false
  compare_target:
    description: Path to the second recipe JSON file for the compare operation.
    required: false
outputs:
  output-directory:
    description: Directory containing the generated or fetched recipe JSON.
    value: ${{ steps.convert.outputs.output-directory || steps.get_recipe.outputs.output-directory }}
  markdown-file:
    description: Path to the Markdown file generated by the get operation.
    value: ${{ steps.get_recipe.outputs.markdown-file }}
  recipe-title:
    description: Title of the fetched recipe.
    value: ${{ steps.get_recipe.outputs.recipe-title }}
  details-image-file:
    description: Downloaded details image path, if the recipe has an image.
    value: ${{ steps.get_recipe.outputs.details-image-file }}
  recipe-url:
    description: Full source URL used to fetch the recipe.
    value: ${{ steps.get_recipe.outputs.recipe-url }}
  validation-success:
    description: Whether all selected Markdown recipes were converted successfully.
    value: ${{ steps.convert.outputs.validation-success }}
  validation-report:
    description: Conversion summary or the validation errors for selected Markdown recipes.
    value: ${{ steps.convert.outputs.validation-report }}
  converted-json-files:
    description: JSON array of recipe JSON paths generated by Markdown conversion.
    value: ${{ steps.convert.outputs.converted-json-files }}
  recipes-equal:
    description: Whether the JSON documents compared by the compare operation are identical.
    value: ${{ steps.compare.outputs.recipes-equal }}
  comparison-report:
    description: Summary of the JSON comparison.
    value: ${{ steps.compare.outputs.comparison-report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Validate operation
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        SESSION_TOKEN: ${{ inputs.session_token }}
        SECRETS_WRITE_TOKEN: ${{ inputs.secrets_write_token }}
      run: |
        case "$OPERATION" in
          validate|compare|draft|publish|get) ;;
          *) echo "operation must be validate, compare, draft, publish, or get" >&2; exit 1 ;;
        esac
        case "$OPERATION" in
          get|draft|publish)
            test -n "$SESSION_TOKEN" || { echo "session_token is required for $OPERATION" >&2; exit 1; }
            test -n "$SECRETS_WRITE_TOKEN" || { echo "secrets_write_token is required for $OPERATION to persist token refreshes" >&2; exit 1; }
            ;;
        esac
    - name: Install image processing dependency
      if: ${{ inputs.operation == 'validate' || inputs.operation == 'draft' || inputs.operation == 'publish' }}
      shell: bash
      run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
    - id: convert
      if: ${{ inputs.operation == 'validate' || inputs.operation == 'draft' || inputs.operation == 'publish' }}
      continue-on-error: ${{ inputs.capture_validation == 'true' }}
      shell: bash
      env:
        RECIPE_GLOB: ${{ inputs.recipes }}
        RECIPE_FILES_JSON: ${{ inputs.recipe_files }}
        OUTPUT_DIR: ${{ inputs.output }}
      run: python "${{ github.action_path }}/action/convert.py"
    - id: compare
      if: ${{ inputs.operation == 'compare' }}
      shell: bash
      env:
        COMPARE_SOURCE: ${{ inputs.compare_source }}
        COMPARE_TARGET: ${{ inputs.compare_target }}
      run: python "${{ github.action_path }}/action/compare_recipes.py"
    - name: Install CLI for recipe operations
      if: ${{ inputs.operation == 'get' || inputs.operation == 'draft' || inputs.operation == 'publish' }}
      shell: bash
      run: python -m pip install --disable-pip-version-check "${{ github.action_path }}"
    - id: get_recipe
      if: ${{ inputs.operation == 'get' }}
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        SESSION_TOKEN: ${{ inputs.session_token }}
        GH_SECRETS_WRITE_TOKEN: ${{ inputs.secrets_write_token }}
        OUTPUT_DIR: ${{ inputs.output }}
        MARKDOWN_OUTPUT_DIR: ${{ inputs.markdown_output }}
        ACTION_DEBUG: ${{ runner.debug }}
      run: python "${{ github.action_path }}/action/get_recipe.py"
    - name: Prepare recipe drafts or publish recipes
      if: ${{ inputs.operation == 'draft' || inputs.operation == 'publish' }}
      shell: bash
      env:
        RECIPE_JSON_DIR: ${{ steps.convert.outputs.output-directory }}
        SESSION_TOKEN: ${{ inputs.session_token }}
        PUBLISH_MODE: ${{ inputs.operation }}
        GH_SECRETS_WRITE_TOKEN: ${{ inputs.secrets_write_token }}
      run: python "${{ github.action_path }}/action/publish_recipes.py"
